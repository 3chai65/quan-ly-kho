name: Deploy Worker to Cloudflare

on:
  push:
    branches:
      - main
  # Cho phép bấm chạy tay trong tab Actions
  workflow_dispatch:

# Không chạy 2 lần deploy cùng lúc
concurrency:
  group: deploy-quan-ly-kho
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests
        run: node --test "tests/**/*.test.mjs"

      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Chỉ thêm dòng dưới nếu báo lỗi không tìm thấy account (tạo secret CLOUDFLARE_ACCOUNT_ID):
          # accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
